[phases.setup]
nixPkgs = ['...', 'php84', 'php84Extensions.pdo_mysql', 'php84Extensions.mbstring', 'php84Extensions.gd']

[phases.build]
cmds = ['composer install --no-dev --optimize-autoloader']

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link || true && php artisan serve --host=0.0.0.0 --port=$PORT'
